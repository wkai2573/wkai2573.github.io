<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Outer glowing diamond/hex -->
  <polygon points="32,8 54,20 54,44 32,56 10,44 10,20" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- Stylized K letter / Game Controller D-pad & action dot hybrid -->
  <path d="M22 19 L22 45" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M38 21 L24 32 L39 44" stroke="url(#glowGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Small spark/glow at the vertex -->
  <circle cx="43" cy="21" r="2.5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="44" cy="44" r="2.5" fill="#f43f5e" filter="url(#glow)"/>
</svg>

